<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPM Question Bank — 300 Questions</title>
<style>
:root{--card:#111a30;--muted:#95a4c5;--text:#f4f7ff;--accent:#79a8ff;--good:#37d99a;--bad:#ff6d78;--line:#293754}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#07101f,#111b31);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:8;background:rgba(7,16,31,.96);border-bottom:1px solid var(--line);padding:12px 16px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}.maker{margin-top:5px;font-size:13px;color:#ffd166}.maker strong{color:#f4f7ff}.pill{background:#17233d;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:13px}
main{padding:22px 16px 60px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{background:#0d162b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px}input{flex:1;min-width:230px}select{min-width:160px}
.grid{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}.q{direction:ltr;text-align:left;font-size:17px;font-weight:700;line-height:1.5}
.options{direction:ltr;display:grid;gap:7px;margin-top:12px}.opt{text-align:left;border:1px solid var(--line);background:#0d162b;color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer}.opt.correct{border-color:var(--good);background:rgba(55,217,154,.13)}.opt.wrong{border-color:var(--bad);background:rgba(255,109,120,.13)}.answer{display:none;direction:ltr;text-align:left;margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#0b1428;line-height:1.5}.count{margin-bottom:12px;color:var(--muted);font-size:13px}.topbtn{border:0;background:var(--accent);color:#07101e;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
</style></head><body><header><div class="wrap"><div class="top"><div><h1>CPM Question Bank — 300 Questions</h1><div class="sub">بنك أسئلة مصحح — بدون أسئلة تكشف الإجابة داخل السؤال</div><div class="maker">Made by: <strong>Mohammad Khallaf</strong></div></div><span class="pill">300 Questions</span></div></div></header>
<main><div class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="ابحث..." oninput="render()"><select id="section" onchange="render()"><option value="">كل الأقسام</option></select><button class="topbtn" onclick="expandAll()">إظهار كل الإجابات</button><button class="topbtn" onclick="collapseAll()">إخفاء كل الإجابات</button></div><div class="count" id="count"></div><div class="grid" id="grid"></div></div></main>
<script>
const Q=[{"q": "When establishing a product strategy, what should come first as the strategic foundation?", "o": ["Clarifying the product’s purpose and why it should exist", "Choosing distribution channels", "Writing detailed feature specifications", "Selecting development tools"], "a": 0, "e": "A strong product strategy begins with the product’s purpose and rationale before moving into execution details.", "s": "Quizlet concept", "p": "Product strategy foundation"}, {"q": "Goods and services bought by individuals for their own use are classified as:", "o": ["Consumer products", "Industrial products", "Capital products", "Business services"], "a": 0, "e": "Consumer products are purchased for personal consumption.", "s": "Quizlet concept", "p": "Consumer products"}, {"q": "True or False: A Product Manager should develop product strategy without regard to the firm’s overall market strategy.", "o": ["True", "False"], "a": 1, "e": "Product strategy should align with the company’s broader market strategy.", "s": "Quizlet concept", "p": "Strategic alignment"}, {"q": "Which organizational elements provide the strongest foundation for aligning a new product strategy?", "o": ["Vision and mission", "Quarterly sales quota only", "Feature backlog only", "Advertising calendar only"], "a": 0, "e": "Vision and mission establish the strategic direction that product strategy should support.", "s": "Quizlet concept", "p": "Vision & mission"}, {"q": "Upstream Product Management primarily focuses on:", "o": ["Roadmaps, portfolio needs, and guiding development before launch", "Post-launch sales support only", "Customer service operations only", "Retirement execution only"], "a": 0, "e": "Upstream work is concentrated on strategy, portfolio needs, roadmaps, and development before launch.", "s": "Quizlet concept", "p": "Upstream PM"}, {"q": "Downstream Product Management primarily focuses on:", "o": ["Marketing and sales-support activities after launch", "Concept generation only", "Engineering architecture only", "Idea screening only"], "a": 0, "e": "Downstream work focuses on sustaining profitable sales through marketing and sales support after launch.", "s": "Quizlet concept", "p": "Downstream PM"}, {"q": "Which artifact most directly expresses a customer requirement in terms of role, need, and value?", "o": ["User Story", "Product Backlog", "Roadmap", "Business Case"], "a": 0, "e": "A user story captures who the user is, what they need, and the value or outcome they seek.", "s": "Quizlet concept", "p": "User Story"}, {"q": "Innovation that replaces existing market offerings with a new approach that creates significantly greater stakeholder value is best described as:", "o": ["Disruptive innovation", "Incremental innovation", "Process maintenance", "Line extension"], "a": 0, "e": "Disruptive innovation can displace existing offerings by delivering substantially different or greater value.", "s": "Quizlet concept", "p": "Innovation"}, {"q": "PESTEL extends PEST by adding which two factors?", "o": ["Environmental and Legal", "Education and Logistics", "Ethics and Labor", "Execution and Leadership"], "a": 0, "e": "PESTEL adds Environmental and Legal factors to Political, Economic, Social, and Technological analysis.", "s": "Quizlet concept", "p": "PESTEL"}, {"q": "Porter’s Five Forces is primarily used to evaluate:", "o": ["Industry/market attractiveness and competitive pressure", "Only internal employee skills", "Only launch timing", "Only product design quality"], "a": 0, "e": "The model assesses competitive forces affecting industry attractiveness and strategic decisions.", "s": "Quizlet concept", "p": "Porter Five Forces"}, {"q": "Market penetration, market development, product development, and diversification belong to which framework?", "o": ["Ansoff Matrix", "BCG Matrix", "SWOT", "7-S Framework"], "a": 0, "e": "The Ansoff Matrix organizes these four growth strategies.", "s": "Quizlet concept", "p": "Ansoff Matrix"}, {"q": "Which discipline uses structured activities, tools, and techniques to examine an organization’s structure, policies, processes, and operations?", "o": ["Business Analysis", "Product Styling", "Brand Design", "Sales Enablement"], "a": 0, "e": "Business Analysis examines organizational needs and operations using structured analytical methods.", "s": "Quizlet concept", "p": "Business Analysis"}, {"q": "In the BCG Matrix, a product with high market share in a high-growth market is a:", "o": ["Star", "Cash Cow", "Question Mark", "Dog"], "a": 0, "e": "High share plus high market growth is the Star quadrant.", "s": "Quizlet concept", "p": "BCG Matrix"}, {"q": "In DACI, who is responsible for driving the decision process forward?", "o": ["Driver", "Approver", "Contributor", "Informed"], "a": 0, "e": "The Driver coordinates and moves the decision process forward.", "s": "Quizlet concept", "p": "DACI"}, {"q": "In DACI, who gives the formal approval for the decision?", "o": ["Approver", "Driver", "Contributor", "Informed"], "a": 0, "e": "The Approver provides approval or final authorization.", "s": "Quizlet concept", "p": "DACI"}, {"q": "In DACI, who provides expertise and input without owning the final decision?", "o": ["Contributor", "Approver", "Driver", "Informed"], "a": 0, "e": "Contributors provide relevant input and expertise.", "s": "Quizlet concept", "p": "DACI"}, {"q": "In DACI, which group needs awareness of the final decision but does not directly shape it?", "o": ["Informed", "Driver", "Approver", "Contributor"], "a": 0, "e": "The Informed group is kept aware of the outcome.", "s": "Quizlet concept", "p": "DACI"}, {"q": "A laptop bundled with complimentary software and an extended warranty is an example of which product level?", "o": ["Augmented product", "Core benefit", "Basic product only", "Expected product only"], "a": 0, "e": "Extra services and benefits beyond the expected product are part of the augmented product.", "s": "Quizlet concept", "p": "Product levels"}, {"q": "A space in which buyers and sellers transact and supply-and-demand forces operate is a:", "o": ["Market", "Segment", "Exchange mechanism only", "Value proposition"], "a": 0, "e": "A market is the environment in which buyers and sellers interact and supply and demand operate.", "s": "Quizlet concept", "p": "Market"}, {"q": "Which statement best distinguishes upstream from downstream Product Management?", "o": ["Upstream shapes the product before launch; downstream supports market success after launch", "Upstream is only engineering; downstream is only finance", "They are identical", "Downstream occurs before upstream"], "a": 0, "e": "The core distinction is pre-launch strategy/development guidance versus post-launch commercial support.", "s": "Quizlet concept", "p": "Upstream vs downstream"}, {"q": "Which question is a Place decision?", "o": ["How will you reach target customers?", "How can you access the right distribution channels?", "What is the user experience?", "What are the company values?"], "a": 1, "e": "Distribution channel access belongs to Place.", "s": "Section 1", "p": "15"}, {"q": "Which question is a Promotion decision?", "o": ["How do competitors promote competing products?", "What product features are missing?", "What assets are controlled?", "What is the company structure?"], "a": 0, "e": "Competitive promotional activity is part of Promotion.", "s": "Section 1", "p": "17"}, {"q": "Which question is a People decision in a service context?", "o": ["What expertise is needed to deliver and support the service?", "What interest rates apply?", "What is the product roadmap?", "What is the market growth rate?"], "a": 0, "e": "People covers service-delivery expertise and relationship-building.", "s": "Section 1", "p": "18"}, {"q": "Which question is a Process decision?", "o": ["How will customer support be provided?", "What is the product called?", "What are the revenue streams?", "What are the barriers to entry?"], "a": 0, "e": "Customer support is listed under Process.", "s": "Section 1", "p": "19"}, {"q": "Which question is a Physical Proof decision?", "o": ["What environment is required to deliver the service?", "What is the competitor price?", "Which segments are measurable?", "What is the company mission?"], "a": 0, "e": "The service-delivery environment is part of Physical Proof.", "s": "Section 1", "p": "20"}, {"q": "Strategic planning is the managerial process of developing and maintaining a strategic fit among organizational objectives, resources, and:", "o": ["Changing market opportunities", "Packaging choices", "Sprint duration", "Customer complaints"], "a": 0, "e": "The material defines strategic planning around objectives, resources and changing market opportunities.", "s": "Section 2", "p": "107"}, {"q": "Which is a component of the strategic plan listed in the material?", "o": ["Mission Statement", "Sprint Backlog", "Beta Defect Log", "End-of-Life Notice"], "a": 0, "e": "Mission Statement is explicitly listed as a strategic-plan component.", "s": "Section 2", "p": "108"}, {"q": "A mission statement describes a company's function, markets, competitive advantages, and:", "o": ["Business goals and philosophies", "Only quarterly revenue", "Only product features", "Only customer complaints"], "a": 0, "e": "The mission statement is defined as a short written statement of business goals and philosophies.", "s": "Section 2", "p": "109"}, {"q": "A vision statement expresses:", "o": ["Current process defects", "Overarching aspirations of what the organization hopes to achieve or become", "Detailed pricing rules", "Supplier contracts"], "a": 1, "e": "That is the material’s definition of a vision statement.", "s": "Section 2", "p": "110"}, {"q": "A values statement defines:", "o": ["What the organization believes in and expected behavior toward stakeholders", "Only the revenue target", "Only product quality standards", "Only the launch date"], "a": 0, "e": "Values address beliefs and expected behavior with colleagues, customers, suppliers and stakeholders.", "s": "Section 2", "p": "111"}, {"q": "A business model is a framework describing how an organization:", "o": ["Creates, delivers and captures value", "Writes code", "Schedules meetings", "Controls only costs"], "a": 0, "e": "The material uses the create-deliver-capture value definition.", "s": "Section 2", "p": "115"}, {"q": "Business model creation is part of:", "o": ["Business strategy", "Only HR planning", "Only product retirement", "Only manufacturing"], "a": 0, "e": "The material states business model creation is part of business strategy.", "s": "Section 2", "p": "115"}, {"q": "Which is a stated value of a business model?", "o": ["Allows managers to focus on value creation", "Guarantees market leadership", "Eliminates competition", "Makes forecasting unnecessary"], "a": 0, "e": "The material notes that business models allow managers to focus on value creation.", "s": "Section 2", "p": "116"}, {"q": "In the Business Model Canvas, “Who helps you?” maps to:", "o": ["Key Partners", "Customer Segments", "Channels", "Revenue Streams"], "a": 0, "e": "Key Partners captures the supplier/partner network that makes the model work.", "s": "Section 2", "p": "117-118"}, {"q": "In the Business Model Canvas, the most important things the company must do are:", "o": ["Key Activities", "Key Resources", "Channels", "Customer Relationships"], "a": 0, "e": "Key Activities are the important activities required to make the business model work.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, assets controlled to deliver the value proposition are:", "o": ["Key Resources", "Revenue Streams", "Customer Segments", "Cost Structure"], "a": 0, "e": "Key Resources are the controlled assets supporting delivery of the value proposition.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, how products or services are delivered to customers is captured by:", "o": ["Channels", "Key Activities", "Cost Structure", "Key Partners"], "a": 0, "e": "Channels describe how the organization delivers products or services to customers.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, the groups of customers served are:", "o": ["Customer Segments", "Key Partners", "Key Resources", "Revenue Streams"], "a": 0, "e": "Customer Segments identifies the groups of customers served.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, how the company fosters and maintains customer relationships is:", "o": ["Customer Relationships", "Channels", "Key Activities", "Cost Structure"], "a": 0, "e": "Customer Relationships captures how the firm fosters and maintains relationships.", "s": "Section 2", "p": "117"}, {"q": "Which SWOT element includes experience, knowledge, unique characteristics and resources?", "o": ["Strengths", "Weaknesses", "Opportunities", "Threats"], "a": 0, "e": "These items are examples of strengths.", "s": "Section 2", "p": "122"}, {"q": "Which SWOT element includes strategic alliances, partnerships, product development and innovation?", "o": ["Opportunities", "Threats", "Weaknesses", "Strengths"], "a": 0, "e": "The material lists these as opportunities.", "s": "Section 2", "p": "122"}, {"q": "Which SWOT element includes strong competition and competitors’ new products?", "o": ["Threats", "Strengths", "Opportunities", "Values"], "a": 0, "e": "These are listed as threats.", "s": "Section 2", "p": "122"}, {"q": "Which SWOT element includes gaps in experience or knowledge and loss of key staff?", "o": ["Weaknesses", "Strengths", "Opportunities", "Threats"], "a": 0, "e": "These are listed under weaknesses.", "s": "Section 2", "p": "122"}, {"q": "Which PEST category includes demographics, consumer attitudes and lifestyle trends?", "o": ["Social", "Political", "Economic", "Technological"], "a": 0, "e": "These factors are listed under Social.", "s": "Section 2", "p": "125"}, {"q": "Which PEST category includes government policies, regulatory bodies, trade policies and wars?", "o": ["Political", "Social", "Economic", "Technological"], "a": 0, "e": "These are political factors in the material.", "s": "Section 2", "p": "125"}, {"q": "Which PEST category includes interest rates and exchange rates?", "o": ["Economic", "Technological", "Political", "Social"], "a": 0, "e": "Interest and exchange rates are listed under Economic.", "s": "Section 2", "p": "125"}, {"q": "Which PEST category includes patents, technology access and innovation potential?", "o": ["Technological", "Economic", "Political", "Social"], "a": 0, "e": "These are listed under Technological factors.", "s": "Section 2", "p": "125"}, {"q": "In the BCG matrix, Stars have:", "o": ["High market share and high market growth", "Low share and low growth", "High share and low growth", "Low share and high growth"], "a": 0, "e": "Stars are high-share businesses in fast-growing industries.", "s": "Section 2", "p": "129"}, {"q": "As successful Stars move into a maturing market, they tend to become:", "o": ["Cash Cows", "Question Marks", "Dogs", "New Entrants"], "a": 0, "e": "The material states successful Stars migrate to Cash Cows as markets mature.", "s": "Section 2", "p": "129"}, {"q": "Cash Cows are characterized by:", "o": ["High market share and low market growth", "Low share and high growth", "High growth and no cash flow", "Low share and low growth only"], "a": 0, "e": "Cash Cows have relatively high market share and low market growth.", "s": "Section 2", "p": "130"}, {"q": "In consumer-market segmentation, age, income and occupation are examples of:", "o": ["Demographic variables", "Behavioral variables", "Psychographic variables", "Geographic variables"], "a": 0, "e": "Age, income and occupation are listed as demographic segmentation variables.", "s": "Section 3", "p": "234"}, {"q": "Benefits sought, brand loyalty and usage rate are examples of:", "o": ["Behavioral segmentation", "Geographic segmentation", "Demographic segmentation", "Psychographic segmentation"], "a": 0, "e": "These are listed under Behavior.", "s": "Section 3", "p": "234"}, {"q": "Activities, attitudes, interests and values are examples of:", "o": ["Psychographic segmentation", "Behavioral segmentation", "Geographic segmentation", "Demographic segmentation"], "a": 0, "e": "These are psychographic variables.", "s": "Section 3", "p": "234"}, {"q": "Climate, region and population density are examples of:", "o": ["Geographic segmentation", "Psychographic segmentation", "Behavioral segmentation", "Demographic segmentation"], "a": 0, "e": "These are geographic variables.", "s": "Section 3", "p": "234"}, {"q": "In industrial-market segmentation, company size and industry are examples of:", "o": ["Company Type variables", "Consumer psychographics", "Consumer demographics", "Physical proof"], "a": 0, "e": "Company age, size and industry are listed under Company Type.", "s": "Section 3", "p": "235"}, {"q": "A target segment should be:", "o": ["Distinct, accessible, measurable and profitable", "Large, global, cheap and permanent", "Innovative, regulated, local and complex", "Only profitable"], "a": 0, "e": "The material lists Distinct, Accessible, Measurable and Profitable as key targeting factors.", "s": "Section 3", "p": "236"}, {"q": "Positioning occurs after:", "o": ["Segmentation and targeting", "Retirement", "Licensing only", "Packaging only"], "a": 0, "e": "The material states positioning follows segmentation and targeting.", "s": "Section 3", "p": "237"}, {"q": "Which is part of the positioning process?", "o": ["Analyze the chosen target’s wants and needs", "Ignore channels", "Avoid defining the offering", "Eliminate the pitch"], "a": 0, "e": "The positioning slide says to analyze target wants/needs, define offering, describe channels and build the pitch.", "s": "Section 3", "p": "237"}, {"q": "A perceptual map primarily illustrates:", "o": ["How consumers perceive products or brands based on attributes", "Internal organizational structure", "Supplier contracts", "Financial statements"], "a": 0, "e": "The material defines perceptual maps around consumer perception.", "s": "Section 3", "p": "238"}, {"q": "A positioning map primarily emphasizes:", "o": ["Competitive positioning within the market", "Employee satisfaction", "Only consumer sentiment", "Packaging design"], "a": 0, "e": "Positioning maps depict the competitive landscape and market position.", "s": "Section 3", "p": "241"}, {"q": "Compared with positioning maps, perceptual maps focus more on:", "o": ["Consumer perception and preferences", "Budget decisions", "Supplier power", "Internal processes"], "a": 0, "e": "The comparison slide states perceptual maps focus on consumer perception/preferences.", "s": "Section 3", "p": "243"}, {"q": "“Occupy an unclaimed space” is an example of a:", "o": ["Positioning strategy", "PEST factor", "Gate decision", "Licensing model"], "a": 0, "e": "It is listed among positioning strategies.", "s": "Section 3", "p": "244"}, {"q": "Which is a warning sign that positioning should be re-examined?", "o": ["Prospects have trouble understanding what problem the product solves", "The product has a roadmap", "The firm has suppliers", "The market is measurable"], "a": 0, "e": "Difficulty understanding the product problem is listed as a positioning warning sign.", "s": "Section 3", "p": "245"}, {"q": "Which is a repositioning option for a current product?", "o": ["Change product communication to the same target market", "Never change target or attributes", "Only change accounting treatment", "Only change supplier contracts"], "a": 0, "e": "The material lists changing communication while keeping the same target market.", "s": "Section 3", "p": "246"}, {"q": "A Value System is defined as:", "o": ["The system of organizations involved in moving a good or service from supplier to customer", "Only the manufacturer’s internal process", "Only customer support", "A pricing formula"], "a": 0, "e": "That is the definition given for the extended value delivery network.", "s": "Section 3", "p": "252"}, {"q": "A business ecosystem includes infrastructure, company, suppliers, distributors, partners, third-party vendors, competitors and:", "o": ["Customers", "Only employees", "Only regulators", "Only investors"], "a": 0, "e": "Customers are part of the business ecosystem definition.", "s": "Section 3", "p": "253"}, {"q": "A key Product Manager function in the value chain is:", "o": ["Orchestrating and coordinating the internal value chain", "Writing every line of code", "Owning all legal approvals", "Replacing every functional manager"], "a": 0, "e": "The material identifies orchestration and coordination of the internal value chain as a key PM function.", "s": "Section 3", "p": "255"}, {"q": "Product Managers may help identify and manage relationships with:", "o": ["Suppliers, partners and third-party vendors", "Only competitors", "Only shareholders", "Only auditors"], "a": 0, "e": "These ecosystem participants are specifically called out.", "s": "Section 3", "p": "255"}, {"q": "According to AIPMM, Product Management is the process of:", "o": ["Conceiving, planning, developing, qualifying, launching, delivering and retiring products", "Only developing and launching products", "Only marketing mature products", "Only writing requirements"], "a": 0, "e": "This is the exact seven-part process definition in the material.", "s": "Section 3", "p": "258"}, {"q": "ProdBOK is described as:", "o": ["A widely accepted set of strategies, methodologies, concepts, terms and activities for product management and marketing", "A software development framework only", "A financial accounting standard", "A sales compensation system"], "a": 0, "e": "This is the material’s definition of ProdBOK.", "s": "Section 3", "p": "260"}, {"q": "ProdBOK applies:", "o": ["Across industries and throughout each phase of the product life cycle", "Only to software startups", "Only to consumer products", "Only during launch"], "a": 0, "e": "The material says it applies to any product or portfolio across industries throughout the lifecycle.", "s": "Section 3", "p": "260"}, {"q": "One benefit of the Product Management Framework is to:", "o": ["Define a common language that improves communication and outcomes", "Eliminate cross-functional work", "Remove the need for schedules", "Replace strategy"], "a": 0, "e": "A common language is one of the listed framework benefits.", "s": "Section 3", "p": "264"}, {"q": "The ultimate goal highlighted by the framework is to expand:", "o": ["Users, Usage, Uses", "Price, Place, Promotion", "Staff, Skills, Systems", "Strengths, Weaknesses, Opportunities"], "a": 0, "e": "The slide explicitly states the ultimate goal is to expand Users, Usage and Uses.", "s": "Section 3", "p": "266"}, {"q": "The Product Life Cycle is described as:", "o": ["The phases through which products progress from development to withdrawal from the market", "Only the launch event", "Only a pricing cycle", "Only a manufacturing schedule"], "a": 0, "e": "That is the material’s lifecycle definition.", "s": "Section 3", "p": "268"}, {"q": "Which deliverable in Conceive answers “What is the market problem?”", "o": ["MRD", "PRD", "Launch Plan", "Marketing Plan"], "a": 0, "e": "The Marketing Requirements Document identifies the market problem, opportunity, segments and constraints.", "s": "Section 3", "p": "270"}, {"q": "Which Conceive deliverable answers “What is the opportunity?”", "o": ["Business Case", "Roadmap", "Beta Program Plan", "End-of-Life Plan"], "a": 0, "e": "The Business Case answers “What is the opportunity?”", "s": "Section 3", "p": "270"}, {"q": "Which Plan deliverable answers “What is the proposed solution?”", "o": ["PRD", "MRD", "Business Case", "Launch Plan"], "a": 0, "e": "The Product Requirements Document describes the whole proposed solution.", "s": "Section 3", "p": "270"}, {"q": "Which Plan deliverable describes the long-term vision and objectives for a product or portfolio?", "o": ["Roadmap", "MRD", "Business Case", "Beta Program Plan"], "a": 0, "e": "The roadmap describes long-term vision and objectives.", "s": "Section 3", "p": "270"}, {"q": "The Marketing Strategy Plan primarily addresses:", "o": ["The messaging platform", "Testing specifications", "End-of-life withdrawal", "Sprint estimates"], "a": 0, "e": "Its purpose is stated as “What is the messaging platform?”", "s": "Section 3", "p": "270"}, {"q": "The Beta Program Plan is associated with which phase?", "o": ["Develop", "Conceive", "Deliver", "Retire"], "a": 0, "e": "The key-deliverables table associates Beta Program Plan with Develop.", "s": "Section 3", "p": "270"}, {"q": "The Launch Plan is associated with which phase in the key-deliverables table?", "o": ["Qualify", "Plan", "Conceive", "Retire"], "a": 0, "e": "The Launch Plan is the key deliverable shown under Qualify.", "s": "Section 3", "p": "270"}, {"q": "During Launch, the product team should primarily:", "o": ["Manage and control implementation of the Launch Plan and take corrective action as needed", "Create the initial MRD", "Write the first Business Case", "Begin retirement immediately"], "a": 0, "e": "This is the stated Launch responsibility in the key-deliverables table.", "s": "Section 3", "p": "270"}, {"q": "The Marketing Plan in Deliver is intended to answer:", "o": ["How will we create demand and meet revenue goals?", "What is the market problem?", "What is the proposed solution?", "How will we withdraw the product?"], "a": 0, "e": "The Deliver Marketing Plan covers demand creation, revenue goals, tactics, budget and timing.", "s": "Section 3", "p": "270"}, {"q": "The End-of-Life Plan belongs to:", "o": ["Retire", "Develop", "Qualify", "Plan"], "a": 0, "e": "The End-of-Life Plan is the key Retire deliverable.", "s": "Section 3", "p": "270"}, {"q": "The End-of-Life Plan is meant to answer:", "o": ["How will we gracefully withdraw the product from the market?", "How will we test the beta?", "How will we define requirements?", "How will we position the product?"], "a": 0, "e": "The material frames EOL planning around graceful withdrawal and avoiding negative consequences.", "s": "Section 3", "p": "270"}, {"q": "In a Phase-Gate process, a gate is best described as:", "o": ["A decision, quality-control and investment-control checkpoint", "A marketing campaign", "A pricing formula", "A customer segment"], "a": 0, "e": "The material describes gates as decision, quality-control and investment-control checkpoints.", "s": "Section 3", "p": "Phase-Gate"}, {"q": "Which is a possible gate decision?", "o": ["Recycle", "Advertise", "Acquire", "Segment"], "a": 0, "e": "Possible gate decisions include Go, No-Go, Hold and Recycle.", "s": "Section 3", "p": "Phase-Gate"}, {"q": "As successive phases proceed in the Phase-Gate process, resource commitments generally:", "o": ["Increase", "Decrease to zero", "Remain fixed", "Become irrelevant"], "a": 0, "e": "The material states that successive phases require more resource commitments.", "s": "Section 3", "p": "Phase-Gate"}, {"q": "A Product-Focused organizational structure has which advantage?", "o": ["Clear responsibility and strong product advocacy", "No cannibalization risk", "Guaranteed alignment with business strategy", "No short-term pressure"], "a": 0, "e": "Clear responsibility and strong product advocacy are listed advantages.", "s": "Section 3", "p": "Organization"}, {"q": "A potential disadvantage of Product-Focused structure is:", "o": ["Product cannibalization", "No product advocacy", "No ownership", "No development resources"], "a": 0, "e": "Product cannibalization is listed among the cons.", "s": "Section 3", "p": "Organization"}, {"q": "A Market-Focused organization is especially strong in:", "o": ["Customer focus", "Individual product ownership", "Functional specialization only", "Eliminating coordination needs"], "a": 0, "e": "Strong customer focus is a listed advantage.", "s": "Section 3", "p": "Organization"}, {"q": "A disadvantage of a Market-Focused organization is that it may:", "o": ["Not give Product Management full responsibility for products", "Have no customer focus", "Eliminate market knowledge", "Prevent coordination"], "a": 0, "e": "This limitation is explicitly listed.", "s": "Section 3", "p": "Organization"}, {"q": "A Function-Focused organization has which advantage?", "o": ["Strong functional training", "Full product ownership by one person", "No strategic conflicts", "No coordination requirements"], "a": 0, "e": "Strong functional training is a listed advantage.", "s": "Section 3", "p": "Organization"}, {"q": "A Function-Focused organization may suffer because:", "o": ["No single person or group is responsible for product health", "It has too much product ownership", "It ignores functional expertise", "It eliminates executive involvement"], "a": 0, "e": "The material lists lack of single-point accountability for product health as a con.", "s": "Section 3", "p": "Organization"}, {"q": "Organizational growth stage and structure affect Product Management because they:", "o": ["Alter the PM focus, roles and responsibilities", "Never affect PM work", "Only affect finance", "Only affect product naming"], "a": 0, "e": "The material says company growth stage and structure alter Product Management focus and roles.", "s": "Section 3", "p": "Organization"}, {"q": "New Product Development (NPD) is defined as:", "o": ["The complete process of bringing a new product to market", "Only concept generation", "Only engineering", "Only promotion"], "a": 0, "e": "The material defines NPD as the complete process of bringing a new product to market.", "s": "Section 4", "p": "361"}, {"q": "Which is part of the NPD process?", "o": ["Idea Screening", "End-of-Life withdrawal only", "Cash Cow harvesting only", "Physical Proof only"], "a": 0, "e": "Idea Screening is one of the listed NPD process steps.", "s": "Section 4", "p": "362"}, {"q": "Which sequence begins the NPD process shown in the material?", "o": ["Strategy → Concept Generation → Idea Screening", "Launch → Decline → Withdrawal", "Testing → Strategy → Retirement", "Pricing → Packaging → Divest"], "a": 0, "e": "The NPD process begins with Strategy, Concept Generation and Idea Screening.", "s": "Section 4", "p": "362"}, {"q": "The NPD process is described as phases of activities and:", "o": ["Decision gates", "Only advertisements", "Only cost reports", "Only customer interviews"], "a": 0, "e": "The material says NPD consists of phases of activities and decision gates.", "s": "Section 4", "p": "363"}, {"q": "One parallel path in NPD involves idea generation, product design and:", "o": ["Detail engineering", "Only public relations", "Only retirement planning", "Only sales compensation"], "a": 0, "e": "Detail engineering is part of one of the two parallel NPD paths.", "s": "Section 4", "p": "364"}, {"q": "The other parallel path in NPD involves market research and:", "o": ["Marketing analysis", "Only legal review", "Only HR planning", "Only packaging"], "a": 0, "e": "Market research and marketing analysis form the second path.", "s": "Section 4", "p": "364"}, {"q": "Gates facilitate screening of new-product ideas based on factors such as:", "o": ["Alignment with strategic objectives", "Logo color only", "Office location only", "Current payroll system"], "a": 0, "e": "Strategic alignment is one of the listed screening criteria.", "s": "Section 4", "p": "366"}, {"q": "Which is a screening criterion for new-product ideas?", "o": ["Potential market acceptance", "Number of meeting rooms", "CEO travel schedule", "Advertising font"], "a": 0, "e": "Potential market acceptance is listed as a screening criterion.", "s": "Section 4", "p": "366"}, {"q": "Screening should take place:", "o": ["Throughout the product life cycle", "Only once before concept generation", "Only after withdrawal", "Only after launch"], "a": 0, "e": "The material explicitly says screening should occur throughout the lifecycle.", "s": "Section 4", "p": "366"}, {"q": "In the Agile Scrum diagram, a sprint is shown as lasting approximately:", "o": ["1–4 weeks", "6–12 months", "1 day only", "2 years"], "a": 0, "e": "The slide shows 1–4 weeks for a sprint.", "s": "Section 4", "p": "368"}, {"q": "The Sprint Backlog contains:", "o": ["Features assigned to the sprint, estimated by the team, with team commitment", "Only retired products", "Only competitor data", "Only customer demographics"], "a": 0, "e": "These are the three items shown under Sprint Backlog.", "s": "Section 4", "p": "368"}, {"q": "Acquisition can include:", "o": ["Acquiring specific brands or purchasing an entire organization", "Only licensing software", "Only hiring employees", "Only changing channels"], "a": 0, "e": "The material defines acquisition as ownership achieved by acquiring brands or an entire organization.", "s": "Section 4", "p": "369"}, {"q": "Licensing means:", "o": ["The owner licenses product rights, temporarily or permanently", "The buyer always purchases the entire company", "Only internal product development", "Only market segmentation"], "a": 0, "e": "The material describes licensing as granting product rights temporarily or permanently.", "s": "Section 4", "p": "370"}, {"q": "A go-to-market (GTM) strategy is an action plan specifying how a company will:", "o": ["Reach target customers and achieve competitive advantage", "Retire all products", "Only build prototypes", "Only recruit staff"], "a": 0, "e": "This is the material’s GTM definition.", "s": "Section 4", "p": "379"}, {"q": "The purpose of a GTM strategy is to provide:", "o": ["A blueprint for delivering a product to the end customer", "Only an engineering backlog", "Only a finance report", "Only a mission statement"], "a": 0, "e": "The material states that GTM provides a blueprint for delivery to the end customer.", "s": "Section 4", "p": "379"}, {"q": "Which is one of the launch-plan key steps shown?", "o": ["Target Audience", "Maturity withdrawal only", "Staff turnover", "Value chain outsourcing"], "a": 0, "e": "Target Audience is one of the listed launch-plan steps.", "s": "Section 4", "p": "374"}, {"q": "Which is one of the launch-plan key steps shown?", "o": ["Win/Loss Analysis", "Mission rewrite", "End-of-life destruction", "Supplier consolidation only"], "a": 0, "e": "Win/Loss Analysis is listed as a key launch-plan step.", "s": "Section 4", "p": "374"}, {"q": "Which item appears in the Product Launch Timeline?", "o": ["Sales Training", "Retirement gate", "BCG divestiture", "Capability maturity level"], "a": 0, "e": "Sales Training is explicitly included in the timeline.", "s": "Section 4", "p": "376"}, {"q": "During the Growth stage of commercialization:", "o": ["Sales rise at a growing rate, profits increase, and competitors enter", "Sales always decline", "The product is withdrawn", "No competitors enter"], "a": 0, "e": "That is how the Growth stage is described.", "s": "Section 4", "p": "386"}, {"q": "During Maturity, the primary goal is to:", "o": ["Maintain market share and extend the product life cycle", "Withdraw immediately", "Stop all marketing", "Avoid customers"], "a": 0, "e": "The material identifies maintaining share and extending lifecycle as the primary maturity goal.", "s": "Section 4", "p": "388"}, {"q": "Decline occurs when:", "o": ["The product peaks and begins a downward slide in sales", "Sales accelerate", "The product is first introduced", "The business model is created"], "a": 0, "e": "The material describes decline as beginning after the product peaks and sales turn downward.", "s": "Section 4", "p": "390"}, {"q": "Commercialization is the process by which:", "o": ["A new product is introduced into the general market", "A mission statement is written", "A product is only designed", "A supplier is selected"], "a": 0, "e": "That is the review definition of commercialization.", "s": "Section 4", "p": "391"}, {"q": "Commercialization phases run from initial introduction through:", "o": ["Mass production and adoption", "Only concept testing", "Only business model design", "Only retirement planning"], "a": 0, "e": "The material says commercialization extends through mass production and adoption.", "s": "Section 4", "p": "391"}, {"q": "During Introduction, a company should secure distribution and ensure partners have:", "o": ["Resources and knowledge to market the product", "Only a legal name", "Only a product roadmap", "Only a PEST analysis"], "a": 0, "e": "The Introduction strategy explicitly calls for preparing distribution partners with resources and knowledge.", "s": "Section 4", "p": "384"}, {"q": "Critical pricing strategies are implemented during the commercialization stage of:", "o": ["Introduction", "Withdrawal", "Retirement only", "Concept generation"], "a": 0, "e": "Critical pricing strategies are listed under Introduction activities.", "s": "Section 4", "p": "384"}, {"q": "When establishing a product strategy, what should come first as the strategic foundation?", "o": ["Selecting development tools", "Choosing distribution channels", "Writing detailed feature specifications", "Clarifying the product’s purpose and why it should exist"], "a": 3, "e": "A strong product strategy begins with the product’s purpose and rationale before moving into execution details.", "s": "Quizlet concept — practice variant", "p": "Product strategy foundation"}, {"q": "Goods and services bought by individuals for their own use are classified as:", "o": ["Business services", "Consumer products", "Capital products", "Industrial products"], "a": 1, "e": "Consumer products are purchased for personal consumption.", "s": "Quizlet concept — practice variant", "p": "Consumer products"}, {"q": "True or False: A Product Manager should develop product strategy without regard to the firm’s overall market strategy.", "o": ["True", "False"], "a": 1, "e": "Product strategy should align with the company’s broader market strategy.", "s": "Quizlet concept — practice variant", "p": "Strategic alignment"}, {"q": "Which organizational elements provide the strongest foundation for aligning a new product strategy?", "o": ["Feature backlog only", "Advertising calendar only", "Quarterly sales quota only", "Vision and mission"], "a": 3, "e": "Vision and mission establish the strategic direction that product strategy should support.", "s": "Quizlet concept — practice variant", "p": "Vision & mission"}, {"q": "Upstream Product Management primarily focuses on:", "o": ["Customer service operations only", "Post-launch sales support only", "Retirement execution only", "Roadmaps, portfolio needs, and guiding development before launch"], "a": 3, "e": "Upstream work is concentrated on strategy, portfolio needs, roadmaps, and development before launch.", "s": "Quizlet concept — practice variant", "p": "Upstream PM"}, {"q": "Downstream Product Management primarily focuses on:", "o": ["Marketing and sales-support activities after launch", "Idea screening only", "Engineering architecture only", "Concept generation only"], "a": 0, "e": "Downstream work focuses on sustaining profitable sales through marketing and sales support after launch.", "s": "Quizlet concept — practice variant", "p": "Downstream PM"}, {"q": "Which artifact most directly expresses a customer requirement in terms of role, need, and value?", "o": ["Business Case", "User Story", "Product Backlog", "Roadmap"], "a": 1, "e": "A user story captures who the user is, what they need, and the value or outcome they seek.", "s": "Quizlet concept — practice variant", "p": "User Story"}, {"q": "Innovation that replaces existing market offerings with a new approach that creates significantly greater stakeholder value is best described as:", "o": ["Incremental innovation", "Disruptive innovation", "Line extension", "Process maintenance"], "a": 1, "e": "Disruptive innovation can displace existing offerings by delivering substantially different or greater value.", "s": "Quizlet concept — practice variant", "p": "Innovation"}, {"q": "PESTEL extends PEST by adding which two factors?", "o": ["Education and Logistics", "Ethics and Labor", "Environmental and Legal", "Execution and Leadership"], "a": 2, "e": "PESTEL adds Environmental and Legal factors to Political, Economic, Social, and Technological analysis.", "s": "Quizlet concept — practice variant", "p": "PESTEL"}, {"q": "Porter’s Five Forces is primarily used to evaluate:", "o": ["Only launch timing", "Only internal employee skills", "Only product design quality", "Industry/market attractiveness and competitive pressure"], "a": 3, "e": "The model assesses competitive forces affecting industry attractiveness and strategic decisions.", "s": "Quizlet concept — practice variant", "p": "Porter Five Forces"}, {"q": "Market penetration, market development, product development, and diversification belong to which framework?", "o": ["SWOT", "Ansoff Matrix", "BCG Matrix", "7-S Framework"], "a": 1, "e": "The Ansoff Matrix organizes these four growth strategies.", "s": "Quizlet concept — practice variant", "p": "Ansoff Matrix"}, {"q": "Which discipline uses structured activities, tools, and techniques to examine an organization’s structure, policies, processes, and operations?", "o": ["Product Styling", "Business Analysis", "Sales Enablement", "Brand Design"], "a": 1, "e": "Business Analysis examines organizational needs and operations using structured analytical methods.", "s": "Quizlet concept — practice variant", "p": "Business Analysis"}, {"q": "In the BCG Matrix, a product with high market share in a high-growth market is a:", "o": ["Dog", "Star", "Question Mark", "Cash Cow"], "a": 1, "e": "High share plus high market growth is the Star quadrant.", "s": "Quizlet concept — practice variant", "p": "BCG Matrix"}, {"q": "In DACI, who is responsible for driving the decision process forward?", "o": ["Driver", "Informed", "Contributor", "Approver"], "a": 0, "e": "The Driver coordinates and moves the decision process forward.", "s": "Quizlet concept — practice variant", "p": "DACI"}, {"q": "In DACI, who gives the formal approval for the decision?", "o": ["Contributor", "Approver", "Informed", "Driver"], "a": 1, "e": "The Approver provides approval or final authorization.", "s": "Quizlet concept — practice variant", "p": "DACI"}, {"q": "In DACI, who provides expertise and input without owning the final decision?", "o": ["Contributor", "Approver", "Informed", "Driver"], "a": 0, "e": "Contributors provide relevant input and expertise.", "s": "Quizlet concept — practice variant", "p": "DACI"}, {"q": "In DACI, which group needs awareness of the final decision but does not directly shape it?", "o": ["Approver", "Informed", "Contributor", "Driver"], "a": 1, "e": "The Informed group is kept aware of the outcome.", "s": "Quizlet concept — practice variant", "p": "DACI"}, {"q": "A laptop bundled with complimentary software and an extended warranty is an example of which product level?", "o": ["Augmented product", "Basic product only", "Core benefit", "Expected product only"], "a": 0, "e": "Extra services and benefits beyond the expected product are part of the augmented product.", "s": "Quizlet concept — practice variant", "p": "Product levels"}, {"q": "A space in which buyers and sellers transact and supply-and-demand forces operate is a:", "o": ["Segment", "Exchange mechanism only", "Market", "Value proposition"], "a": 2, "e": "A market is the environment in which buyers and sellers interact and supply and demand operate.", "s": "Quizlet concept — practice variant", "p": "Market"}, {"q": "Which statement best distinguishes upstream from downstream Product Management?", "o": ["They are identical", "Downstream occurs before upstream", "Upstream shapes the product before launch; downstream supports market success after launch", "Upstream is only engineering; downstream is only finance"], "a": 2, "e": "The core distinction is pre-launch strategy/development guidance versus post-launch commercial support.", "s": "Quizlet concept — practice variant", "p": "Upstream vs downstream"}, {"q": "Which question is a Place decision?", "o": ["How can you access the right distribution channels?", "How will you reach target customers?", "What is the user experience?", "What are the company values?"], "a": 0, "e": "Distribution channel access belongs to Place.", "s": "Section 1 — practice variant", "p": "15"}, {"q": "Which question is a Promotion decision?", "o": ["What product features are missing?", "How do competitors promote competing products?", "What assets are controlled?", "What is the company structure?"], "a": 1, "e": "Competitive promotional activity is part of Promotion.", "s": "Section 1 — practice variant", "p": "17"}, {"q": "Which question is a People decision in a service context?", "o": ["What is the market growth rate?", "What expertise is needed to deliver and support the service?", "What is the product roadmap?", "What interest rates apply?"], "a": 1, "e": "People covers service-delivery expertise and relationship-building.", "s": "Section 1 — practice variant", "p": "18"}, {"q": "Which question is a Process decision?", "o": ["How will customer support be provided?", "What are the revenue streams?", "What are the barriers to entry?", "What is the product called?"], "a": 0, "e": "Customer support is listed under Process.", "s": "Section 1 — practice variant", "p": "19"}, {"q": "Which question is a Physical Proof decision?", "o": ["What is the company mission?", "What environment is required to deliver the service?", "Which segments are measurable?", "What is the competitor price?"], "a": 1, "e": "The service-delivery environment is part of Physical Proof.", "s": "Section 1 — practice variant", "p": "20"}, {"q": "Strategic planning is the managerial process of developing and maintaining a strategic fit among organizational objectives, resources, and:", "o": ["Changing market opportunities", "Customer complaints", "Packaging choices", "Sprint duration"], "a": 0, "e": "The material defines strategic planning around objectives, resources and changing market opportunities.", "s": "Section 2 — practice variant", "p": "107"}, {"q": "Which is a component of the strategic plan listed in the material?", "o": ["Beta Defect Log", "End-of-Life Notice", "Sprint Backlog", "Mission Statement"], "a": 3, "e": "Mission Statement is explicitly listed as a strategic-plan component.", "s": "Section 2 — practice variant", "p": "108"}, {"q": "A mission statement describes a company's function, markets, competitive advantages, and:", "o": ["Only quarterly revenue", "Only product features", "Business goals and philosophies", "Only customer complaints"], "a": 2, "e": "The mission statement is defined as a short written statement of business goals and philosophies.", "s": "Section 2 — practice variant", "p": "109"}, {"q": "A vision statement expresses:", "o": ["Detailed pricing rules", "Overarching aspirations of what the organization hopes to achieve or become", "Supplier contracts", "Current process defects"], "a": 1, "e": "That is the material’s definition of a vision statement.", "s": "Section 2 — practice variant", "p": "110"}, {"q": "A values statement defines:", "o": ["Only product quality standards", "What the organization believes in and expected behavior toward stakeholders", "Only the launch date", "Only the revenue target"], "a": 1, "e": "Values address beliefs and expected behavior with colleagues, customers, suppliers and stakeholders.", "s": "Section 2 — practice variant", "p": "111"}, {"q": "A business model is a framework describing how an organization:", "o": ["Controls only costs", "Creates, delivers and captures value", "Schedules meetings", "Writes code"], "a": 1, "e": "The material uses the create-deliver-capture value definition.", "s": "Section 2 — practice variant", "p": "115"}, {"q": "Business model creation is part of:", "o": ["Business strategy", "Only product retirement", "Only HR planning", "Only manufacturing"], "a": 0, "e": "The material states business model creation is part of business strategy.", "s": "Section 2 — practice variant", "p": "115"}, {"q": "Which is a stated value of a business model?", "o": ["Guarantees market leadership", "Eliminates competition", "Allows managers to focus on value creation", "Makes forecasting unnecessary"], "a": 2, "e": "The material notes that business models allow managers to focus on value creation.", "s": "Section 2 — practice variant", "p": "116"}, {"q": "In the Business Model Canvas, “Who helps you?” maps to:", "o": ["Customer Segments", "Revenue Streams", "Channels", "Key Partners"], "a": 3, "e": "Key Partners captures the supplier/partner network that makes the model work.", "s": "Section 2 — practice variant", "p": "117-118"}, {"q": "In the Business Model Canvas, the most important things the company must do are:", "o": ["Customer Relationships", "Channels", "Key Activities", "Key Resources"], "a": 2, "e": "Key Activities are the important activities required to make the business model work.", "s": "Section 2 — practice variant", "p": "117"}, {"q": "In the Business Model Canvas, assets controlled to deliver the value proposition are:", "o": ["Key Resources", "Customer Segments", "Cost Structure", "Revenue Streams"], "a": 0, "e": "Key Resources are the controlled assets supporting delivery of the value proposition.", "s": "Section 2 — practice variant", "p": "117"}, {"q": "In the Business Model Canvas, how products or services are delivered to customers is captured by:", "o": ["Cost Structure", "Channels", "Key Partners", "Key Activities"], "a": 1, "e": "Channels describe how the organization delivers products or services to customers.", "s": "Section 2 — practice variant", "p": "117"}, {"q": "In the Business Model Canvas, the groups of customers served are:", "o": ["Key Partners", "Customer Segments", "Key Resources", "Revenue Streams"], "a": 1, "e": "Customer Segments identifies the groups of customers served.", "s": "Section 2 — practice variant", "p": "11 er Qualify.", "s": "Section 3 — practice variant", "p": "270"}, {"q": "During Launch, the product team should primarily:", "o": ["Manage and control implementation of the Launch Plan and take corrective action as needed", "Write the first Business Case", "Create the initial MRD", "Begin retirement immediately"], "a": 0, "e": "This is the stated Launch responsibility in the key-deliverables table.", "s": "Section 3 — practice variant", "p": "270"}, {"q": "The Marketing Plan in Deliver is intended to answer:", "o": ["How will we create demand and meet revenue goals?", "What is the market problem?", "How will we withdraw the product?", "What is the proposed solution?"], "a": 0, "e": "The Deliver Marketing Plan covers demand creation, revenue goals, tactics, budget and timing.", "s": "Section 3 — practice variant", "p": "270"}, {"q": "The End-of-Life Plan belongs to:", "o": ["Retire", "Qualify", "Plan", "Develop"], "a": 0, "e": "The End-of-Life Plan is the key Retire deliverable.", "s": "Section 3 — practice variant", "p": "270"}, {"q": "The End-of-Life Plan is meant to answer:", "o": ["How will we gracefully withdraw the product from the market?", "How will we test the beta?", "How will we position the product?", "How will we define requirements?"], "a": 0, "e": "The material frames EOL planning around graceful withdrawal and avoiding negative consequences.", "s": "Section 3 — practice variant", "p": "270"}, {"q": "In a Phase-Gate process, a gate is best described as:", "o": ["A decision, quality-control and investment-control checkpoint", "A marketing campaign", "A pricing formula", "A customer segment"], "a": 0, "e": "The material describes gates as decision, quality-control and investment-control checkpoints.", "s": "Section 3 — practice variant", "p": "Phase-Gate"}, {"q": "Which is a possible gate decision?", "o": ["Acquire", "Segment", "Advertise", "Recycle"], "a": 3, "e": "Possible gate decisions include Go, No-Go, Hold and Recycle.", "s": "Section 3 — practice variant", "p": "Phase-Gate"}, {"q": "As successive phases proceed in the Phase-Gate process, resource commitments generally:", "o": ["Remain fixed", "Increase", "Decrease to zero", "Become irrelevant"], "a": 1, "e": "The material states that successive phases require more resource commitments.", "s": "Section 3 — practice variant", "p": "Phase-Gate"}, {"q": "A Product-Focused organizational structure has which advantage?", "o": ["Clear responsibility and strong product advocacy", "No cannibalization risk", "No short-term pressure", "Guaranteed alignment with business strategy"], "a": 0, "e": "Clear responsibility and strong product advocacy are listed advantages.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "A potential disadvantage of Product-Focused structure is:", "o": ["No development resources", "Product cannibalization", "No product advocacy", "No ownership"], "a": 1, "e": "Product cannibalization is listed among the cons.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "A Market-Focused organization is especially strong in:", "o": ["Eliminating coordination needs", "Functional specialization only", "Customer focus", "Individual product ownership"], "a": 2, "e": "Strong customer focus is a listed advantage.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "A disadvantage of a Market-Focused organization is that it may:", "o": ["Have no customer focus", "Eliminate market knowledge", "Prevent coordination", "Not give Product Management full responsibility for products"], "a": 3, "e": "This limitation is explicitly listed.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "A Function-Focused organization has which advantage?", "o": ["No strategic conflicts", "No coordination requirements", "Strong functional training", "Full product ownership by one person"], "a": 2, "e": "Strong functional training is a listed advantage.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "A Function-Focused organization may suffer because:", "o": ["It eliminates executive involvement", "No single person or group is responsible for product health", "It ignores functional expertise", "It has too much product ownership"], "a": 1, "e": "The material lists lack of single-point accountability for product health as a con.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "Organizational growth stage and structure affect Product Management because they:", "o": ["Alter the PM focus, roles and responsibilities", "Only affect product naming", "Never affect PM work", "Only affect finance"], "a": 0, "e": "The material says company growth stage and structure alter Product Management focus and roles.", "s": "Section 3 — practice variant", "p": "Organization"}, {"q": "New Product Development (NPD) is defined as:", "o": ["Only engineering", "Only promotion", "Only concept generation", "The complete process of bringing a new product to market"], "a": 3, "e": "The material defines NPD as the complete process of bringing a new product to market.", "s": "Section 4 — practice variant", "p": "361"}, {"q": "Which is part of the NPD process?", "o": ["Physical Proof only", "Cash Cow harvesting only", "End-of-Life withdrawal only", "Idea Screening"], "a": 3, "e": "Idea Screening is one of the listed NPD process steps.", "s": "Section 4 — practice variant", "p": "362"}, {"q": "Which sequence begins the NPD process shown in the material?", "o": ["Launch → Decline → Withdrawal", "Testing → Strategy → Retirement", "Strategy → Concept Generation → Idea Screening", "Pricing → Packaging → Divest"], "a": 2, "e": "The NPD process begins with Strategy, Concept Generation and Idea Screening.", "s": "Section 4 — practice variant", "p": "362"}, {"q": "The NPD process is described as phases of activities and:", "o": ["Only customer interviews", "Only cost reports", "Decision gates", "Only advertisements"], "a": 2, "e": "The material says NPD consists of phases of activities and decision gates.", "s": "Section 4 — practice variant", "p": "363"}, {"q": "One parallel path in NPD involves idea generation, product design and:", "o": ["Only retirement planning", "Detail engineering", "Only sales compensation", "Only public relations"], "a": 1, "e": "Detail engineering is part of one of the two parallel NPD paths.", "s": "Section 4 — practice variant", "p": "364"}, {"q": "The other parallel path in NPD involves market research and:", "o": ["Only HR planning", "Only packaging", "Marketing analysis", "Only legal review"], "a": 2, "e": "Market research and marketing analysis form the second path.", "s": "Section 4 — practice variant", "p": "364"}, {"q": "Gates facilitate screening of new-product ideas based on factors such as:", "o": ["Current payroll system", "Office location only", "Alignment with strategic objectives", "Logo color only"], "a": 2, "e": "Strategic alignment is one of the listed screening criteria.", "s": "Section 4 — practice variant", "p": "366"}, {"q": "Which is a screening criterion for new-product ideas?", "o": ["CEO travel schedule", "Potential market acceptance", "Number of meeting rooms", "Advertising font"], "a": 1, "e": "Potential market acceptance is listed as a screening criterion.", "s": "Section 4 — practice variant", "p": "366"}, {"q": "Screening should take place:", "o": ["Only after launch", "Only after withdrawal", "Throughout the product life cycle", "Only once before concept generation"], "a": 2, "e": "The material explicitly says screening should occur throughout the lifecycle.", "s": "Section 4 — practice variant", "p": "366"}, {"q": "In the Agile Scrum diagram, a sprint is shown as lasting approximately:", "o": ["6–12 months", "1–4 weeks", "1 day only", "2 years"], "a": 1, "e": "The slide shows 1–4 weeks for a sprint.", "s": "Section 4 — practice variant", "p": "368"}, {"q": "The Sprint Backlog contains:", "o": ["Only customer demographics", "Features assigned to the sprint, estimated by the team, with team commitment", "Only retired products", "Only competitor data"], "a": 1, "e": "These are the three items shown under Sprint Backlog.", "s": "Section 4 — practice variant", "p": "368"}, {"q": "Acquisition can include:", "o": ["Only changing channels", "Only hiring employees", "Acquiring specific brands or purchasing an entire organization", "Only licensing software"], "a": 2, "e": "The material defines acquisition as ownership achieved by acquiring brands or an entire organization.", "s": "Section 4 — practice variant", "p": "369"}, {"q": "Licensing means:", "o": ["Only market segmentation", "The owner licenses product rights, temporarily or permanently", "The buyer always purchases the entire company", "Only internal product development"], "a": 1, "e": "The material describes licensing as granting product rights temporarily or permanently.", "s": "Section 4 — practice variant", "p": "370"}, {"q": "A go-to-market (GTM) strategy is an action plan specifying how a company will:", "o": ["Retire all products", "Only build prototypes", "Reach target customers and achieve competitive advantage", "Only recruit staff"], "a": 2, "e": "This is the material’s GTM definition.", "s": "Section 4 — practice variant", "p": "379"}, {"q": "The purpose of a GTM strategy is to provide:", "o": ["Only a mission statement", "Only an engineering backlog", "A blueprint for delivering a product to the end customer", "Only a finance report"], "a": 2, "e": "The material states that GTM provides a blueprint for delivery to the end customer.", "s": "Section 4 — practice variant", "p": "379"}, {"q": "Which is one of the launch-plan key steps shown?", "o": ["Staff turnover", "Value chain outsourcing", "Maturity withdrawal only", "Target Audience"], "a": 3, "e": "Target Audience is one of the listed launch-plan steps.", "s": "Section 4 — practice variant", "p": "374"}, {"q": "Which is one of the launch-plan key steps shown?", "o": ["Supplier consolidation only", "Win/Loss Analysis", "Mission rewrite", "End-of-life destruction"], "a": 1, "e": "Win/Loss Analysis is listed as a key launch-plan step.", "s": "Section 4 — practice variant", "p": "374"}, {"q": "Which item appears in the Product Launch Timeline?", "o": ["Retirement gate", "Capability maturity level", "BCG divestiture", "Sales Training"], "a": 3, "e": "Sales Training is explicitly included in the timeline.", "s": "Section 4 — practice variant", "p": "376"}, {"q": "During the Growth stage of commercialization:", "o": ["Sales rise at a growing rate, profits increase, and competitors enter", "No competitors enter", "Sales always decline", "The product is withdrawn"], "a": 0, "e": "That is how the Growth stage is described.", "s": "Section 4 — practice variant", "p": "386"}, {"q": "During Maturity, the primary goal is to:", "o": ["Avoid customers", "Withdraw immediately", "Stop all marketing", "Maintain market share and extend the product life cycle"], "a": 3, "e": "The material identifies maintaining share and extending lifecycle as the primary maturity goal.", "s": "Section 4 — practice variant", "p": "388"}, {"q": "Decline occurs when:", "o": ["The business model is created", "Sales accelerate", "The product peaks and begins a downward slide in sales", "The product is first introduced"], "a": 2, "e": "The material describes decline as beginning after the product peaks and sales turn downward.", "s": "Section 4 — practice variant", "p": "390"}, {"q": "Commercialization is the process by which:", "o": ["A product is only designed", "A mission statement is written", "A supplier is selected", "A new product is introduced into the general market"], "a": 3, "e": "That is the review definition of commercialization.", "s": "Section 4 — practice variant", "p": "391"}, {"q": "Commercialization phases run from initial introduction through:", "o": ["Only business model design", "Mass production and adoption", "Only concept testing", "Only retirement planning"], "a": 1, "e": "The material says commercialization extends through mass production and adoption.", "s": "Section 4 — practice variant", "p": "391"}, {"q": "During Introduction, a company should secure distribution and ensure partners have:", "o": ["Only a PEST analysis", "Resources and knowledge to market the product", "Only a product roadmap", "Only a legal name"], "a": 1, "e": "The Introduction strategy explicitly calls for preparing distribution partners with resources and knowledge.", "s": "Section 4 — practice variant", "p": "384"}, {"q": "Critical pricing strategies are implemented during the commercialization stage of:", "o": ["Introduction", "Withdrawal", "Concept generation", "Retirement only"], "a": 0, "e": "Critical pricing strategies are listed under Introduction activities.", "s": "Section 4 — practice variant", "p": "384"}];const sec=document.getElementById('section');[...new Set(Q.map(x=>x.s))].sort().forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;sec.appendChild(o)});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const term=search.value.trim().toLowerCase(),filter=sec.value;const items=Q.map((x,i)=>({...x,n:i+1})).filter(x=>(!filter||x.s===filter)&&(!term||[x.q,x.e,x.s,x.p,...x.o].join(' ').toLowerCase().includes(term)));count.textContent='المعروض: '+items.length+' من '+Q.length+' سؤال';grid.innerHTML='';items.forEach(x=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="meta"><span>Question '+x.n+'</span><span>'+esc(x.s)+' — '+esc(x.p)+'</span></div><div class="q">'+esc(x.q)+'</div>';const opts=document.createElement('div');opts.className='options';x.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+t;b.onclick=()=>showAnswer(c,x,j);opts.appendChild(b)});c.appendChild(opts);const a=document.createElement('div');a.className='answer';a.innerHTML='<b>Correct answer:</b> '+String.fromCharCode(65+x.a)+'. '+esc(x.o[x.a])+'<br><b>Explanation:</b> '+esc(x.e);c.appendChild(a);grid.appendChild(c)})}
function showAnswer(card,x,j){const bs=[...card.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');if(k===j&&j!==x.a)b.classList.add('wrong')});card.querySelector('.answer').style.display='block'}
function expandAll(){document.querySelectorAll('.answer').forEach(x=>x.style.display='block')}function collapseAll(){document.querySelectorAll('.answer').forEach(x=>x.style.display='none');document.querySelectorAll('.opt').forEach(x=>{x.disabled=false;x.classList.remove('correct','wrong')})}render();
</script></body></html>
