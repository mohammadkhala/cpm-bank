 global domains", "thinking and planning for globally competitive domains", "national predatory pricing"], "a": 2, "e": "Correct answer: thinking and planning for globally competitive domains", "s": "Additional Mock Exam", "p": "Q38"}, {"q": "You would like to identify consumers based on factors, such as gender, age, marital status, and discretionary income. What type of research would be most appropriate for you to use?", "o": ["Descriptive Research", "Exploratory Research", "Casual Research", "Demographic Research"], "a": 0, "e": "Correct answer: Descriptive Research", "s": "Additional Mock Exam", "p": "Q39"}, {"q": "A ban on an import of a certain product is called a(n):", "o": ["Embargo", "Exchange Control", "Tariff", "Quota"], "a": 0, "e": "Correct answer: Embargo", "s": "Additional Mock Exam", "p": "Q40"}, {"q": "In order to stay abreast of consumer trends and determine whether new products will succeed, the product manager engages in __________.", "o": ["marketing research", "social media research", "just-in-time (JIT) delivery", "inventory management"], "a": 0, "e": "Correct answer: marketing research", "s": "Additional Mock Exam", "p": "Q41"}, {"q": "The concept that a large percentage of a product's sales revenues come from a relatively small group of purchasers is called the __________.", "o": ["loyalty principle", "expenditure principle", "concentration principle", "purchase aggregate principle"], "a": 0, "e": "Correct answer: loyalty principle", "s": "Additional Mock Exam", "p": "Q42"}, {"q": "A frequent flyer program used by an airline is an example of brand loyalty segmentation.", "o": ["True", "False"], "a": 0, "e": "Correct answer: True", "s": "Additional Mock Exam", "p": "Q43"}, {"q": "Surge pricing is a pricing model that fluctuates based on ______.", "o": ["cultural commodities", "housing rates", "dollar vs euro rates", "increase in demand", "manufacturing surplus"], "a": 3, "e": "Correct answer: increase in demand", "s": "Additional Mock Exam", "p": "Q44"}, {"q": "_____ is a strategy that uses pricing to influence a customer's spending or shopping habits to make more or higher value sales.", "o": ["Discount and Allowance Pricing", "Psychological Pricing", "Promotional Pricing", "Segmented Pricing"], "a": 1, "e": "Correct answer: Psychological Pricing", "s": "Additional Mock Exam", "p": "Q45"}, {"q": "The twofold goal of marketing is to keep and grow current customers by delivering satisfaction, and:", "o": ["enhance stockholder portfolios", "superior value", "pay low overhead costs", "win awards for promotional and marketing excellence"], "a": 1, "e": "Correct answer: superior value", "s": "Additional Mock Exam", "p": "Q46"}, {"q": "Advertising should have three characteristics. The first two characteristics should be that they are meaningful and believable. What is the third characteristic?", "o": ["International", "Simple", "Cost-Oriented", "Distinctive"], "a": 3, "e": "Correct answer: Distinctive", "s": "Additional Mock Exam", "p": "Q47"}, {"q": "Most companies are overwhelmed with information about their customers.", "o": ["True", "False"], "a": 0, "e": "Correct answer: True", "s": "Additional Mock Exam", "p": "Q48"}, {"q": "A key to success for an integrated supply chain management system is teamwork.", "o": ["True", "False"], "a": 0, "e": "Correct answer: True", "s": "Additional Mock Exam", "p": "Q49"}, {"q": "The pricing strategy that permits marketers to control demand in the introductory stages of a product's life cycle and then adjust productive capacity to mach changing demand is known as:", "o": ["Monopolistic Pricing", "Skimming Pricing", "Standard Pricing", "Functional Pricing", "Penetration Pricing"], "a": 1, "e": "Correct answer: Skimming Pricing", "s": "Additional Mock Exam", "p": "Q50"}, {"q": "Michael Porter breaks value chain analysis into five primary activities: inbound logistics, operations, ______, marketing/sales, and service.", "o": ["Procurement", "Human Resource Management", "Technological Development", "outbound logistics"], "a": 3, "e": "Correct answer: outbound logistics", "s": "Additional Mock Exam", "p": "Q51"}, {"q": "Brand name is an example of:", "o": ["an intangible asset", "an organizational capability", "a value chain of activity", "a tangible asset"], "a": 0, "e": "Correct answer: an intangible asset", "s": "Additional Mock Exam", "p": "Q52"}, {"q": "You are a new product manager who has never managed a product before; in this case, it is BEST to rely on _____ to improve your chance of success.", "o": ["your intuition", "stakeholder analysis", "historical information", "change management"], "a": 2, "e": "Correct answer: historical information", "s": "Additional Mock Exam", "p": "Q53"}, {"q": "All of the following are potential pricing problems addressed by legislation to protect consumers and businesses EXCEPT", "o": ["Predatory Pricing", "Discriminatory Pricing", "Price Fixing", "Every Day Low Pricing (EDLP)"], "a": 3, "e": "Correct answer: Every Day Low Pricing (EDLP)", "s": "Additional Mock Exam", "p": "Q54"}, {"q": "One key characteristic of a successful new product is the development of a superior quality product.", "o": ["True", "False"], "a": 1, "e": "Correct answer: False", "s": "Additional Mock Exam", "p": "Q55"}, {"q": "Most companies want to avoid pricing that turns their products into:", "o": ["Shopping Goods", "Specialty Goods", "Commodities", "Service Goods"], "a": 2, "e": "Correct answer: Commodities", "s": "Additional Mock Exam", "p": "Q56"}, {"q": "New entrants to an industry bring:", "o": ["New Capacity", "New Customers", "Fewer Resources", "Better Margins", "Larger Profits"], "a": 0, "e": "Correct answer: New Capacity", "s": "Additional Mock Exam", "p": "Q57"}, {"q": "The first step in the marketing control process is best described as being one where the marketer:", "o": ["Measures Performance", "Sets Measurable Goals", "Evaluates Performance", "Takes Corrective Action"], "a": 1, "e": "Correct answer: Sets Measurable Goals", "s": "Additional Mock Exam", "p": "Q58"}, {"q": "Market orientation often includes improvements in customer service and _____ geared to solving consumer concerns.", "o": ["product support", "release management", "product development", "supply chain management"], "a": 0, "e": "Correct answer: product support", "s": "Additional Mock Exam", "p": "Q59"}, {"q": "Benefits do not have to be defined at the product level.", "o": ["True", "False"], "a": 1, "e": "Correct answer: False", "s": "Additional Mock Exam", "p": "Q60"}, {"q": "Thinking about the Product Adoption Curve, which group of customers is typically skeptical about adopting new technologies?", "o": ["Early Majority", "Late Majority", "Early Adopters", "Innovators"], "a": 1, "e": "Correct answer: Late Majority", "s": "Additional Mock Exam", "p": "Q61"}, {"q": "When establishing a product strategy, what should come first as the strategic foundation?", "o": ["Clarifying the product’s purpose and why it should exist", "Choosing distribution channels", "Writing detailed feature specifications", "Selecting development tools"], "a": 0, "e": "A strong product strategy begins with the product’s purpose and rationale before moving into execution details.", "s": "Quizlet concept", "p": "Product strategy foundation"}, {"q": "Goods and services bought by individuals for their own use are classified as:", "o": ["Consumer products", "Industrial products", "Capital products", "Business services"], "a": 0, "e": "Consumer products are purchased for personal consumption.", "s": "Quizlet concept", "p": "Consumer products"}, {"q": "True or False: A Product Manager should develop product strategy without regard to the firm’s overall market strategy.", "o": ["True", "False"], "a": 1, "e": "Product strategy should align with the company’s broader market strategy.", "s": "Quizlet concept", "p": "Strategic alignment"}, {"q": "Which organizational elements provide the strongest foundation for aligning a new product strategy?", "o": ["Vision and mission", "Quarterly sales quota only", "Feature backlog only", "Advertising calendar only"], "a": 0, "e": "Vision and mission establish the strategic direction that product strategy should support.", "s": "Quizlet concept", "p": "Vision & mission"}, {"q": "Upstream Product Management primarily focuses on:", "o": ["Roadmaps, portfolio needs, and guiding development before launch", "Post-launch sales support only", "Customer service operations only", "Retirement execution only"], "a": 0, "e": "Upstream work is concentrated on strategy, portfolio needs, roadmaps, and development before launch.", "s": "Quizlet concept", "p": "Upstream PM"}, {"q": "Downstream Product Management primarily focuses on:", "o": ["Marketing and sales-support activities after launch", "Concept generation only", "Engineering architecture only", "Idea screening only"], "a": 0, "e": "Downstream work focuses on sustaining profitable sales through marketing and sales support after launch.", "s": "Quizlet concept", "p": "Downstream PM"}, {"q": "Which artifact most directly expresses a customer requirement in terms of role, need, and value?", "o": ["User Story", "Product Backlog", "Roadmap", "Business Case"], "a": 0, "e": "A user story captures who the user is, what they need, and the value or outcome they seek.", "s": "Quizlet concept", "p": "User Story"}, {"q": "Innovation that replaces existing market offerings with a new approach that creates significantly greater stakeholder value is best described as:", "o": ["Disruptive innovation", "Incremental innovation", "Process maintenance", "Line extension"], "a": 0, "e": "Disruptive innovation can displace existing offerings by delivering substantially different or greater value.", "s": "Quizlet concept", "p": "Innovation"}, {"q": "PESTEL extends PEST by adding which two factors?", "o": ["Environmental and Legal", "Education and Logistics", "Ethics and Labor", "Execution and Leadership"], "a": 0, "e": "PESTEL adds Environmental and Legal factors to Political, Economic, Social, and Technological analysis.", "s": "Quizlet concept", "p": "PESTEL"}, {"q": "Porter’s Five Forces is primarily used to evaluate:", "o": ["Industry/market attractiveness and competitive pressure", "Only internal employee skills", "Only launch timing", "Only product design quality"], "a": 0, "e": "The model assesses competitive forces affecting industry attractiveness and strategic decisions.", "s": "Quizlet concept", "p": "Porter Five Forces"}, {"q": "Market penetration, market development, product development, and diversification belong to which framework?", "o": ["Ansoff Matrix", "BCG Matrix", "SWOT", "7-S Framework"], "a": 0, "e": "The Ansoff Matrix organizes these four growth strategies.", "s": "Quizlet concept", "p": "Ansoff Matrix"}, {"q": "Which discipline uses structured activities, tools, and techniques to examine an organization’s structure, policies, processes, and operations?", "o": ["Business Analysis", "Product Styling", "Brand Design", "Sales Enablement"], "a": 0, "e": "Business Analysis examines organizational needs and operations using structured analytical methods.", "s": "Quizlet concept", "p": "Business Analysis"}, {"q": "In the BCG Matrix, a product with high market share in a high-growth market is a:", "o": ["Star", "Cash Cow", "Question Mark", "Dog"], "a": 0, "e": "High share plus high market growth is the Star quadrant.", "s": "Quizlet concept", "p": "BCG Matrix"}, {"q": "In DACI, who is responsible for driving the decision process forward?", "o": ["Driver", "Approver", "Contributor", "Informed"], "a": 0, "e": "The Driver coordinates and moves the decision process forward.", "s": "Quizlet concept", "p": "DACI"}, {"q": "In DACI, who gives the formal approval for the decision?", "o": ["Approver", "Driver", "Contributor", "Informed"], "a": 0, "e": "The Approver provides approval or final authorization.", "s": "Quizlet concept", "p": "DACI"}, {"q": "In DACI, who provides expertise and input without owning the final decision?", "o": ["Contributor", "Approver", "Driver", "Informed"], "a": 0, "e": "Contributors provide relevant input and expertise.", "s": "Quizlet concept", "p": "DACI"}, {"q": "In DACI, which group needs awareness of the final decision but does not directly shape it?", "o": ["Informed", "Driver", "Approver", "Contributor"], "a": 0, "e": "The Informed group is kept aware of the outcome.", "s": "Quizlet concept", "p": "DACI"}, {"q": "A laptop bundled with complimentary software and an extended warranty is an example of which product level?", "o": ["Augmented product", "Core benefit", "Basic product only", "Expected product only"], "a": 0, "e": "Extra services and benefits beyond the expected product are part of the augmented product.", "s": "Quizlet concept", "p": "Product levels"}, {"q": "A space in which buyers and sellers transact and supply-and-demand forces operate is a:", "o": ["Market", "Segment", "Exchange mechanism only", "Value proposition"], "a": 0, "e": "A market is the environment in which buyers and sellers interact and supply and demand operate.", "s": "Quizlet concept", "p": "Market"}, {"q": "Which statement best distinguishes upstream from downstream Product Management?", "o": ["Upstream shapes the product before launch; downstream supports market success after launch", "Upstream is only engineering; downstream is only finance", "They are identical", "Downstream occurs before upstream"], "a": 0, "e": "The core distinction is pre-launch strategy/development guidance versus post-launch commercial support.", "s": "Quizlet concept", "p": "Upstream vs downstream"}, {"q": "Which question is a Place decision?", "o": ["How will you reach target customers?", "How can you access the right distribution channels?", "What is the user experience?", "What are the company values?"], "a": 1, "e": "Distribution channel access belongs to Place.", "s": "Section 1", "p": "15"}, {"q": "Which question is a Promotion decision?", "o": ["How do competitors promote competing products?", "What product features are missing?", "What assets are controlled?", "What is the company structure?"], "a": 0, "e": "Competitive promotional activity is part of Promotion.", "s": "Section 1", "p": "17"}, {"q": "Which question is a People decision in a service context?", "o": ["What expertise is needed to deliver and support the service?", "What interest rates apply?", "What is the product roadmap?", "What is the market growth rate?"], "a": 0, "e": "People covers service-delivery expertise and relationship-building.", "s": "Section 1", "p": "18"}, {"q": "Which question is a Process decision?", "o": ["How will customer support be provided?", "What is the product called?", "What are the revenue streams?", "What are the barriers to entry?"], "a": 0, "e": "Customer support is listed under Process.", "s": "Section 1", "p": "19"}, {"q": "Which question is a Physical Proof decision?", "o": ["What environment is required to deliver the service?", "What is the competitor price?", "Which segments are measurable?", "What is the company mission?"], "a": 0, "e": "The service-delivery environment is part of Physical Proof.", "s": "Section 1", "p": "20"}, {"q": "Strategic planning is the managerial process of developing and maintaining a strategic fit among organizational objectives, resources, and:", "o": ["Changing market opportunities", "Packaging choices", "Sprint duration", "Customer complaints"], "a": 0, "e": "The material defines strategic planning around objectives, resources and changing market opportunities.", "s": "Section 2", "p": "107"}, {"q": "Which is a component of the strategic plan listed in the material?", "o": ["Mission Statement", "Sprint Backlog", "Beta Defect Log", "End-of-Life Notice"], "a": 0, "e": "Mission Statement is explicitly listed as a strategic-plan component.", "s": "Section 2", "p": "108"}, {"q": "A mission statement describes a company's function, markets, competitive advantages, and:", "o": ["Business goals and philosophies", "Only quarterly revenue", "Only product features", "Only customer complaints"], "a": 0, "e": "The mission statement is defined as a short written statement of business goals and philosophies.", "s": "Section 2", "p": "109"}, {"q": "A vision statement expresses:", "o": ["Current process defects", "Overarching aspirations of what the organization hopes to achieve or become", "Detailed pricing rules", "Supplier contracts"], "a": 1, "e": "That is the material’s definition of a vision statement.", "s": "Section 2", "p": "110"}, {"q": "A values statement defines:", "o": ["What the organization believes in and expected behavior toward stakeholders", "Only the revenue target", "Only product quality standards", "Only the launch date"], "a": 0, "e": "Values address beliefs and expected behavior with colleagues, customers, suppliers and stakeholders.", "s": "Section 2", "p": "111"}, {"q": "A business model is a framework describing how an organization:", "o": ["Creates, delivers and captures value", "Writes code", "Schedules meetings", "Controls only costs"], "a": 0, "e": "The material uses the create-deliver-capture value definition.", "s": "Section 2", "p": "115"}, {"q": "Business model creation is part of:", "o": ["Business strategy", "Only HR planning", "Only product retirement", "Only manufacturing"], "a": 0, "e": "The material states business model creation is part of business strategy.", "s": "Section 2", "p": "115"}, {"q": "Which is a stated value of a business model?", "o": ["Allows managers to focus on value creation", "Guarantees market leadership", "Eliminates competition", "Makes forecasting unnecessary"], "a": 0, "e": "The material notes that business models allow managers to focus on value creation.", "s": "Section 2", "p": "116"}, {"q": "In the Business Model Canvas, “Who helps you?” maps to:", "o": ["Key Partners", "Customer Segments", "Channels", "Revenue Streams"], "a": 0, "e": "Key Partners captures the supplier/partner network that makes the model work.", "s": "Section 2", "p": "117-118"}, {"q": "In the Business Model Canvas, the most important things the company must do are:", "o": ["Key Activities", "Key Resources", "Channels", "Customer Relationships"], "a": 0, "e": "Key Activities are the important activities required to make the business model work.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, assets controlled to deliver the value proposition are:", "o": ["Key Resources", "Revenue Streams", "Customer Segments", "Cost Structure"], "a": 0, "e": "Key Resources are the controlled assets supporting delivery of the value proposition.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, how products or services are delivered to customers is captured by:", "o": ["Channels", "Key Activities", "Cost Structure", "Key Partners"], "a": 0, "e": "Channels describe how the organization delivers products or services to customers.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, the groups of customers served are:", "o": ["Customer Segments", "Key Partners", "Key Resources", "Revenue Streams"], "a": 0, "e": "Customer Segments identifies the groups of customers served.", "s": "Section 2", "p": "117"}, {"q": "In the Business Model Canvas, how the company fosters and maintains customer relationships is:", "o": ["Customer Relationships", "Channels", "Key Activities", "Cost Structure"], "a": 0, "e": "Customer Relationships captures how the firm fosters and maintains relationships.", "s": "Section 2", "p": "117"}, {"q": "Which SWOT element includes experience, knowledge, unique characteristics and resources?", "o": ["Strengths", "Weaknesses", "Opportunities", "Threats"], "a": 0, "e": "These items are examples of strengths.", "s": "Section 2", "p": "122"}, {"q": "Which SWOT element includes strategic alliances, partnerships, product development and innovation?", "o": ["Opportunities", "Threats", "Weaknesses", "Strengths"], "a": 0, "e": "The material lists these as opportunities.", "s": "Section 2", "p": "122"}, {"q": "Which SWOT element includes strong competition and competitors’ new products?", "o": ["Threats", "Strengths", "Opportunities", "Values"], "a": 0, "e": "These are listed as threats.", "s": "Section 2", "p": "122"}, {"q": "Which SWOT element includes gaps in experience or knowledge and loss of key staff?", "o": ["Weaknesses", "Strengths", "Opportunities", "Threats"], "a": 0, "e": "These are listed under weaknesses.", "s": "Section 2", "p": "122"}, {"q": "Which PEST category includes demographics, consumer attitudes and lifestyle trends?", "o": ["Social", "Political", "Economic", "Technological"], "a": 0, "e": "These factors are listed under Social.", "s": "Section 2", "p": "125"}, {"q": "Which PEST category includes government policies, regulatory bodies, trade policies and wars?", "o": ["Political", "Social", "Economic", "Technological"], "a": 0, "e": "These are political factors in the material.", "s": "Section 2", "p": "125"}, {"q": "Which PEST category includes interest rates and exchange rates?", "o": ["Economic", "Technological", "Political", "Social"], "a": 0, "e": "Interest and exchange rates are listed under Economic.", "s": "Section 2", "p": "125"}, {"q": "Which PEST category includes patents, technology access and innovation potential?", "o": ["Technological", "Economic", "Political", "Social"], "a": 0, "e": "These are listed under Technological factors.", "s": "Section 2", "p": "125"}, {"q": "In the BCG matrix, Stars have:", "o": ["High market share and high market growth", "Low share and low growth", "High share and low growth", "Low share and high growth"], "a": 0, "e": "Stars are high-share businesses in fast-growing industries.", "s": "Section 2", "p": "129"}, {"q": "As successful Stars move into a maturing market, they tend to become:", "o": ["Cash Cows", "Question Marks", "Dogs", "New Entrants"], "a": 0, "e": "The material states successful Stars migrate to Cash Cows as markets mature.", "s": "Section 2", "p": "129"}, {"q": "Cash Cows are characterized by:", "o": ["High market share and low market growth", "Low share and high growth", "High growth and no cash flow", "Low share and low growth only"], "a": 0, "e": "Cash Cows have relatively high market share and low market growth.", "s": "Section 2", "p": "130"}, {"q": "In consumer-market segmentation, age, income and occupation are examples of:", "o": ["Demographic variables", "Behavioral variables", "Psychographic variables", "Geographic variables"], "a": 0, "e": "Age, income and occupation are listed as demographic segmentation variables.", "s": "Section 3", "p": "234"}, {"q": "Benefits sought, brand loyalty and usage rate are examples of:", "o": ["Behavioral segmentation", "Geographic segmentation", "Demographic segmentation", "Psychographic segmentation"], "a": 0, "e": "These are listed under Behavior.", "s": "Section 3", "p": "234"}, {"q": "Activities, attitudes, interests and values are examples of:", "o": ["Psychographic segmentation", "Behavioral segmentation", "Geographic segmentation", "Demographic segmentation"], "a": 0, "e": "These are psychographic variables.", "s": "Section 3", "p": "234"}, {"q": "Climate, region and population density are examples of:", "o": ["Geographic segmentation", "Psychographic segmentation", "Behavioral segmentation", "Demographic segmentation"], "a": 0, "e": "These are geographic variables.", "s": "Section 3", "p": "234"}, {"q": "In industrial-market segmentation, company size and industry are examples of:", "o": ["Company Type variables", "Consumer psychographics", "Consumer demographics", "Physical proof"], "a": 0, "e": "Company age, size and industry are listed under Company Type.", "s": "Section 3", "p": "235"}, {"q": "A target segment should be:", "o": ["Distinct, accessible, measurable and profitable", "Large, global, cheap and permanent", "Innovative, regulated, local and complex", "Only profitable"], "a": 0, "e": "The material lists Distinct, Accessible, Measurable and Profitable as key targeting factors.", "s": "Section 3", "p": "236"}, {"q": "Positioning occurs after:", "o": ["Segmentation and targeting", "Retirement", "Licensing only", "Packaging only"], "a": 0, "e": "The material states positioning follows segmentation and targeting.", "s": "Section 3", "p": "237"}, {"q": "Which is part of the positioning process?", "o": ["Analyze the chosen target’s wants and needs", "Ignore channels", "Avoid defining the offering", "Eliminate the pitch"], "a": 0, "e": "The positioning slide says to analyze target wants/needs, define offering, describe channels and build the pitch.", "s": "Section 3", "p": "237"}, {"q": "A perceptual map primarily illustrates:", "o": ["How consumers perceive products or brands based on attributes", "Internal organizational structure", "Supplier contracts", "Financial statements"], "a": 0, "e": "The material defines perceptual maps around consumer perception.", "s": "Section 3", "p": "238"}, {"q": "A positioning map primarily emphasizes:", "o": ["Competitive positioning within the market", "Employee satisfaction", "Only consumer sentiment", "Packaging design"], "a": 0, "e": "Positioning maps depict the competitive landscape and market position.", "s": "Section 3", "p": "241"}, {"q": "Compared with positioning maps, perceptual maps focus more on:", "o": ["Consumer perception and preferences", "Budget decisions", "Supplier power", "Internal processes"], "a": 0, "e": "The comparison slide states perceptual maps focus on consumer perception/preferences.", "s": "Section 3", "p": "243"}, {"q": "“Occupy an unclaimed space” is an example of a:", "o": ["Positioning strategy", "PEST factor", "Gate decision", "Licensing model"], "a": 0, "e": "It is listed among positioning strategies.", "s": "Section 3", "p": "244"}, {"q": "Which is a warning sign that positioning should be re-examined?", "o": ["Prospects have trouble understanding what problem the product solves", "The product has a roadmap", "The firm has suppliers", "The market is measurable"], "a": 0, "e": "Difficulty understanding the product problem is listed as a positioning warning sign.", "s": "Section 3", "p": "245"}, {"q": "Which is a repositioning option for a current product?", "o": ["Change product communication to the same target market", "Never change target or attributes", "Only change accounting treatment", "Only change supplier contracts"], "a": 0, "e": "The material lists changing communication while keeping the same target market.", "s": "Section 3", "p": "246"}, {"q": "A Value System is defined as:", "o": ["The system of organizations involved in moving a good or service from supplier to customer", "Only the manufacturer’s internal process", "Only customer support", "A pricing formula"], "a": 0, "e": "That is the definition given for the extended value delivery network.", "s": "Section 3", "p": "252"}, {"q": "A business ecosystem includes infrastructure, company, suppliers, distributors, partners, third-party vendors, competitors and:", "o": ["Customers", "Only employees", "Only regulators", "Only investors"], "a": 0, "e": "Customers are part of the business ecosystem definition.", "s": "Section 3", "p": "253"}, {"q": "A key Product Manager function in the value chain is:", "o": ["Orchestrating and coordinating the internal value chain", "Writing every line of code", "Owning all legal approvals", "Replacing every functional manager"], "a": 0, "e": "The material identifies orchestration and coordination of the internal value chain as a key PM function.", "s": "Section 3", "p": "255"}, {"q": "Product Managers may help identify and manage relationships with:", "o": ["Suppliers, partners and third-party vendors", "Only competitors", "Only shareholders", "Only auditors"], "a": 0, "e": "These ecosystem participants are specifically called out.", "s": "Section 3", "p": "255"}, {"q": "According to AIPMM, Product Management is the process of:", "o": ["Conceiving, planning, developing, qualifying, launching, delivering and retiring products", "Only developing and launching products", "Only marketing mature products", "Only writing requirements"], "a": 0, "e": "This is the exact seven-part process definition in the material.", "s": "Section 3", "p": "258"}, {"q": "ProdBOK is described as:", "o": ["A widely accepted set of strategies, methodologies, concepts, terms and activities for product management and marketing", "A software development framework only", "A financial accounting standard", "A sales compensation system"], "a": 0, "e": "This is the material’s definition of ProdBOK.", "s": "Section 3", "p": "260"}, {"q": "ProdBOK applies:", "o": ["Across industries and throughout each phase of the product life cycle", "Only to software startups", "Only to consumer products", "Only during launch"], "a": 0, "e": "The material says it applies to any product or portfolio across industries throughout the lifecycle.", "s": "Section 3", "p": "260"}, {"q": "One benefit of the Product Management Framework is to:", "o": ["Define a common language that improves communication and outcomes", "Eliminate cross-functional work", "Remove the need for schedules", "Replace strategy"], "a": 0, "e": "A common language is one of the listed framework benefits.", "s": "Section 3", "p": "264"}, {"q": "The ultimate goal highlighted by the framework is to expand:", "o": ["Users, Usage, Uses", "Price, Place, Promotion", "Staff, Skills, Systems", "Strengths, Weaknesses, Opportunities"], "a": 0, "e": "The slide explicitly states the ultimate goal is to expand Users, Usage and Uses.", "s": "Section 3", "p": "266"}, {"q": "The Product Life Cycle is described as:", "o": ["The phases through which products progress from development to withdrawal from the market", "Only the launch event", "Only a pricing cycle", "Only a manufacturing schedule"], "a": 0, "e": "That is the material’s lifecycle definition.", "s": "Section 3", "p": "268"}, {"q": "Which deliverable in Conceive answers “What is the market problem?”", "o": ["MRD", "PRD", "Launch Plan", "Marketing Plan"], "a": 0, "e": "The Marketing Requirements Document identifies the market problem, opportunity, segments and constraints.", "s": "Section 3", "p": "270"}, {"q": "Which Conceive deliverable answers “What is the opportunity?”", "o": ["Business Case", "Roadmap", "Beta Program Plan", "End-of-Life Plan"], "a": 0, "e": "The Business Case answers “What is the opportunity?”", "s": "Section 3", "p": "270"}, {"q": "Which Plan deliverable answers “What is the proposed solution?”", "o": ["PRD", "MRD", "Business Case", "Launch Plan"], "a": 0, "e": "The Product Requirements Document describes the whole proposed solution.", "s": "Section 3", "p": "270"}, {"q": "Which Plan deliverable describes the long-term vision and objectives for a product or portfolio?", "o": ["Roadmap", "MRD", "Business Case", "Beta Program Plan"], "a": 0, "e": "The roadmap describes long-term vision and objectives.", "s": "Section 3", "p": "270"}, {"q": "The Marketing Strategy Plan primarily addresses:", "o": ["The messaging platform", "Testing specifications", "End-of-life withdrawal", "Sprint estimates"], "a": 0, "e": "Its purpose is stated as “What is the messaging platform?”", "s": "Section 3", "p": "270"}, {"q": "The Beta Program Plan is associated with which phase?", "o": ["Develop", "Conceive", "Deliver", "Retire"], "a": 0, "e": "The key-deliverables table associates Beta Program Plan with Develop.", "s": "Section 3", "p": "270"}, {"q": "The Launch Plan is associated with which phase in the key-deliverables table?", "o": ["Qualify", "Plan", "Conceive", "Retire"], "a": 0, "e": "The Launch Plan is the key deliverable shown under Qualify.", "s": "Section 3", "p": "270"}, {"q": "During Launch, the product team should primarily:", "o": ["Manage and control implementation of the Launch Plan and take corrective action as needed", "Create the initial MRD", "Write the first Business Case", "Begin retirement immediately"], "a": 0, "e": "This is the stated Launch responsibility in the key-deliverables table.", "s": "Section 3", "p": "270"}, {"q": "The Marketing Plan in Deliver is intended to answer:", "o": ["How will we create demand and meet revenue goals?", "What is the market problem?", "What is the proposed solution?", "How will we withdraw the product?"], "a": 0, "e": "The Deliver Marketing Plan covers demand creation, revenue goals, tactics, budget and timing.", "s": "Section 3", "p": "270"}, {"q": "The End-of-Life Plan belongs to:", "o": ["Retire", "Develop", "Qualify", "Plan"], "a": 0, "e": "The End-of-Life Plan is the key Retire deliverable.", "s": "Section 3", "p": "270"}, {"q": "The End-of-Life Plan is meant to answer:", "o": ["How will we gracefully withdraw the product from the market?", "How will we test the beta?", "How will we define requirements?", "How will we position the product?"], "a": 0, "e": "The material frames EOL planning around graceful withdrawal and avoiding negative consequences.", "s": "Section 3", "p": "270"}, {"q": "In a Phase-Gate process, a gate is best described as:", "o": ["A decision, quality-control and investment-control checkpoint", "A marketing campaign", "A pricing formula", "A customer segment"], "a": 0, "e": "The material describes gates as decision, quality-control and investment-control checkpoints.", "s": "Section 3", "p": "Phase-Gate"}, {"q": "Which is a possible gate decision?", "o": ["Recycle", "Advertise", "Acquire", "Segment"], "a": 0, "e": "Possible gate decisions include Go, No-Go, Hold and Recycle.", "s": "Section 3", "p": "Phase-Gate"}, {"q": "As successive phases proceed in the Phase-Gate process, resource commitments generally:", "o": ["Increase", "Decrease to zero", "Remain fixed", "Become irrelevant"], "a": 0, "e": "The material states that successive phases require more resource commitments.", "s": "Section 3", "p": "Phase-Gate"}, {"q": "A Product-Focused organizational structure has which advantage?", "o": ["Clear responsibility and strong product advocacy", "No cannibalization risk", "Guaranteed alignment with business strategy", "No short-term pressure"], "a": 0, "e": "Clear responsibility and strong product advocacy are listed advantages.", "s": "Section 3", "p": "Organization"}, {"q": "A potential disadvantage of Product-Focused structure is:", "o": ["Product cannibalization", "No product advocacy", "No ownership", "No development resources"], "a": 0, "e": "Product cannibalization is listed among the cons.", "s": "Section 3", "p": "Organization"}, {"q": "A Market-Focused organization is especially strong in:", "o": ["Customer focus", "Individual product ownership", "Functional specialization only", "Eliminating coordination needs"], "a": 0, "e": "Strong customer focus is a listed advantage.", "s": "Section 3", "p": "Organization"}, {"q": "A disadvantage of a Market-Focused organization is that it may:", "o": ["Not give Product Management full responsibility for products", "Have no customer focus", "Eliminate market knowledge", "Prevent coordination"], "a": 0, "e": "This limitation is explicitly listed.", "s": "Section 3", "p": "Organization"}, {"q": "A Function-Focused organization has which advantage?", "o": ["Strong functional training", "Full product ownership by one person", "No strategic conflicts", "No coordination requirements"], "a": 0, "e": "Strong functional training is a listed advantage.", "s": "Section 3", "p": "Organization"}, {"q": "A Function-Focused organization may suffer because:", "o": ["No single person or group is responsible for product health", "It has too much product ownership", "It ignores functional expertise", "It eliminates executive involvement"], "a": 0, "e": "The material lists lack of single-point accountability for product health as a con.", "s": "Section 3", "p": "Organization"}, {"q": "Organizational growth stage and structure affect Product Management because they:", "o": ["Alter the PM focus, roles and responsibilities", "Never affect PM work", "Only affect finance", " function render(){
 const t=searchBox.value.toLowerCase().trim(), f=sourceFilter.value;
 const xs=Q.map((x,i)=>({...x,n:i+1})).filter(x=>(!f||(f==='AIPMM'?x.s.startsWith('AIPMM'):x.s===f))&&(!t||[x.q,x.e,x.s,...(x.o||[])].join(' ').toLowerCase().includes(t)));
 count.textContent='المعروض: '+xs.length+' من 300';
 grid.innerHTML='';
 xs.forEach(x=>{let c=document.createElement('article');c.className='card';c.innerHTML='<div class="meta"><span>Question '+x.n+'</span><span>'+E(x.s)+' — '+E(x.p)+'</span></div><div class="q">'+E(x.q)+'</div>';
 if(x.o){let os=document.createElement('div');os.className='options';x.o.forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>answer(c,x,j);os.appendChild(b)});c.appendChild(os)}
 else{let b=document.createElement('button');b.className='show';b.textContent='إظهار الإجابة';b.onclick=()=>c.querySelector('.answer').style.display='block';c.appendChild(b)}
 let a=document.createElement('div');a.className='answer';a.innerHTML=(x.o?'<b>Correct answer:</b> '+String.fromCharCode(65+x.a)+'. '+E(x.o[x.a])+'<br>':'')+'<b>Explanation / Answer:</b> '+E(x.e);c.appendChild(a);grid.appendChild(c)})
}
function answer(c,x,j){[...c.querySelectorAll('.opt')].forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');if(k===j&&j!==x.a)b.classList.add('wrong')});c.querySelector('.answer').style.display='block'}
function showAll(){document.querySelectorAll('.answer').forEach(x=>x.style.display='block')}function hideAll(){document.querySelectorAll('.answer').forEach(x=>x.style.display='none');document.querySelectorAll('.opt').forEach(x=>{x.disabled=false;x.classList.remove('correct','wrong')})}render();
